# Local development services. The app itself runs on the host with `pnpm dev`.
name: open-knowledge

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_knowledge
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d open_knowledge']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email sent in development. UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # S3-compatible storage standing in for Cloudflare R2. API at http://localhost:8333
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # One-shot job that creates the media bucket once SeaweedFS is up
  seaweedfs-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: local-access-key
      AWS_SECRET_ACCESS_KEY: local-secret-key
      AWS_DEFAULT_REGION: auto
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://media 2>/dev/null || true
        echo "bucket media ready"
    restart: 'no'

volumes:
  pgdata:
  seaweedfs:
