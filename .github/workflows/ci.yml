name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The build does not connect to these services; validated env vars only need to be well-formed
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci
      PAYLOAD_SECRET: ci-payload-secret-ci-payload-secret-00
      BETTER_AUTH_SECRET: ci-better-auth-secret-ci-better-auth-00
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      EMAIL_FROM_ADDRESS: ci@example.com
      EMAIL_FROM_NAME: Open Knowledge
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: media
      S3_REGION: auto
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm test
      # `payload build` regenerates types and the import map, then type-checks during `next build`
      - run: pnpm build
      - name: Generated files are committed
        run: git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
